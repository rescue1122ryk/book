  <div class="ttl"><h1>JINNAH STATIONARY&nbsp;&nbsp;&amp;&nbsp;&nbsp;FRIENDS BOOK SHOP<br>JINNAH PARK RAHIM YAR KHAN</h1><p>Open a tab, upload the picture, then download or print.</p><span class="chipd" id="today"></span></div>

</div><div class="shelf"></div></header>
<main>
  <div id="msg"></div>
  <div id="drop" class="card drop">
    <p><b>Drop your picture (JPG / PNG) here</b> or <button class="p" id="pick">Choose files</button></p>
    <p class="mu" id="dropHint"></p>
    <input type="file" id="file" accept=".jpg,.jpeg,.png,image/jpeg,image/png" multiple hidden>
  </div>
  <div id="result">
    <div class="tabs" id="tabsBar"></div>
  </div>
</main>
<footer>All rights reserved &mdash; Shahid Jamil, Rescue 1122 RYK &mdash; 03017631541</footer>
<script>
const REPORTS = window.REPORTS || {};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const HINTS = { cnic: 'CNIC tab: upload the front and the back picture of the card (2 pictures).', passport: 'Passport tab: upload ONE photo. The 6 x 4 sheet is made from it.' };
let curTab = '';

function showTab(t) {
  curTab = t;
  document.querySelectorAll('.ownpanel').forEach(e => e.hidden = e.id !== 'panel_' + t);
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  $('dropHint').textContent = HINTS[t] || '';
  if (REPORTS[t] && REPORTS[t].render) REPORTS[t].render();
}
function load(file) {
  $('msg').textContent = '';
  if (!/\.(jpe?g|png)$/i.test(file.name)) { $('msg').textContent = file.name + ': only JPG or PNG pictures are supported.'; return; }
  const r = REPORTS[curTab];
  if (!r || !r.addImage) { $('msg').textContent = 'Open the CNIC or Passport tab first.'; return; }
  r.addImage(file);
}
$('tabsBar').innerHTML = Object.entries(REPORTS).map(([k, r]) => `<button data-tab="${k}" id="tab_${k}">${esc(r.label)}${r.sub ? `<small>${esc(r.sub)}</small>` : ''}</button>`).join('');
$('tabsBar').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) showTab(b.dataset.tab); });
$('today').textContent = new Date().toLocaleDateString('en-GB', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
Object.values(REPORTS).forEach(r => { if (r.init) r.init(); });
if (!REPORTS.cnic) $('msg').textContent = 'report-cnic.js could not be loaded. Keep all files in the same folder.';
if (!REPORTS.passport) $('msg').textContent = 'report-passport.js could not be loaded. Keep all files in the same folder.';
$('pick').onclick = e => { e.stopPropagation(); $('file').click(); };
$('drop').onclick = () => $('file').click();
$('file').onchange = e => { [...e.target.files].forEach(load); e.target.value = ''; };
['dragover', 'dragenter'].forEach(ev => $('drop').addEventListener(ev, e => { e.preventDefault(); $('drop').classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => $('drop').addEventListener(ev, e => { e.preventDefault(); $('drop').classList.remove('over'); }));
$('drop').addEventListener('drop', e => [...e.dataTransfer.files].forEach(load));
showTab(REPORTS.cnic ? 'cnic' : Object.keys(REPORTS)[0]);
</script>
